root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/"
bin = "./tmp/main"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "static", "views", "docs"]
delay = 1000
send_interrupt = false
kill_delay = "500ms"
stop_on_error = false

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
