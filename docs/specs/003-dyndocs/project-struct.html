<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProjectDocs — route/markup structure contract</title>

<!--
  STRUCTURE CONTRACT for 003-dyndocs.
  Companion to project-sample.html (the styled mock). This file documents the
  ROUTE BOUNDARY, not the visuals — same classes, so dev.scss binds unchanged.

  Two routes, one grid:

    /docs/project          -> ProjectLayout   (renders ONCE; owns shell + sidebar)
    /docs/project/:u/:v     -> Doc            (refetches on param change)

  The shell grid (.docs-shell) has THREE columns and its children must stay
  DIRECT grid items. The child route therefore returns a FRAGMENT of two sibling
  roots (.doc + .doc-nav) — do NOT wrap them in a container div, or the
  3-column grid collapses to one item.

  Leptos <Outlet/> emits no wrapper DOM node; hydration marker comments are
  ignored by grid layout — so .doc and .doc-nav remain grid cols 2 and 3.
-->

<link rel="stylesheet" href="./dev.scss" />
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════════════
     Top bar — OUTSIDE the shell. Renders once.
     Note: the trailing breadcrumb crumb (the doc name) is per-doc, so bind that
     one segment to the route param even though the bar itself does not remount.
     ════════════════════════════════════════════════════════════════════════ -->
<div class="nav-sticky">
  <nav aria-label="Primary">
    <div>
      <nav class="crumbs" aria-label="Breadcrumb">
        <ol>
          <li><a href="#">home</a></li>
          <li><a href="#">kubernetes</a></li>
          <li><span aria-current="page"><!-- ← reactive: current doc --></span></li>
        </ol>
      </nav>
    </div>
  </nav>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
     ProjectLayout  —  route "/docs/project"
     Renders ONCE. Owns the grid and the sidebar. Sidebar data is fetched once
     when the layout mounts and is NOT refetched on doc navigation.
     ════════════════════════════════════════════════════════════════════════ -->
<div class="docs-shell">
  <!-- grid col 1 — STATIC. Loaded once with the layout.
       Only .project-nav carries a class; everything inside is reached by
       structural SCSS selectors (each element is unique within the scope):
         .pn-disclosure  ->  .project-nav > details
         .chev           ->  .project-nav summary svg
         .pn-scroll      ->  .project-nav > details > nav
         .pn-home        ->  .project-nav nav > a:has(svg)        (lead link w/ icon)
         .pn-lead        ->  .project-nav nav > a:not(:has(svg))  (lead link, text only)
         .pn-group       ->  .project-nav nav > div
         .pn-cap         ->  .project-nav div > p
         .pn-row         ->  .project-nav li > a                                     -->
  <aside class="project-nav">
    <details open>
      <summary>
        <span>Kubernetes docs</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <nav aria-label="Project documentation">
        <!-- Each row is a router <A> to /docs/project/:u/:v.
             Navigating swaps ONLY the <Outlet/> below — this <nav> stays mounted.
             aria-current="page" tracks the active param reactively. -->
        <a href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/></svg><span>Kubernetes</span></a>
        <a href="#">Introduction</a>

        <div>
          <p>Concepts</p>
          <ul>
            <li><a href="#" aria-current="page">Design &amp; Architecture</a></li>
            <li><a href="#">Pods</a></li>
            <!-- … -->
          </ul>
        </div>
        <!-- … more groups (each a bare <div>) … -->
      </nav>
    </details>
  </aside>

  <!-- ══════════════════════════════════════════════════════════════════════
       <Outlet/>  — child route renders HERE with no wrapping element.
       Everything below this line belongs to the Doc route and refetches per
       :u/:v param. Emit .doc and .doc-nav as SIBLING fragment roots.
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- ┄┄┄┄┄┄┄┄┄┄┄┄ Doc route "/docs/project/:u/:v" — fragment root 1 ┄┄┄┄┄┄┄┄ -->
  <!-- grid col 2 — DYNAMIC. Server fn returns cached comrak HTML; inject via
       inner_html on the article. This subtree is what a doc change swaps.
       One class: .doc is the grid column; target the prose box with .doc > article.
       Prose element rules stay descendant-scoped (.doc h2, .doc p, …) and are
       unaffected by the move — bare comrak output still matches. -->
  <main class="doc">
    <article>
      <!-- inner_html = fetched doc HTML (bare elements, styled under .doc > article) -->
    </article>
  </main>

  <!-- ┄┄┄┄┄┄┄┄┄┄┄┄ Doc route "/docs/project/:u/:v" — fragment root 2 ┄┄┄┄┄┄┄┄ -->
  <!-- grid col 3 — DYNAMIC. TOC + "view source" are DERIVED FROM THIS DOC, so
       they live with the child, not the sidebar. Refetched/rebuilt per doc. -->
  <!-- Only .doc-nav carries a class; the two blocks are told apart by element
       (<section> vs <nav>), so no inner classes are needed:
         .da-inner  ->  .doc-nav > div
         .da-links  ->  .doc-nav section
         .da-cap    ->  .doc-nav p              (the TOC caption)
         .da-link   ->  .doc-nav section a
         .doc-toc   ->  .doc-nav nav
         toc links  ->  .doc-nav nav a  /  .doc-nav nav ul ul a  /  [aria-current] -->
  <aside class="doc-nav">
    <div>
      <!-- View source sits at the top (no caption), TOC below -->
      <section>
        <a href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span>View source</span></a>
      </section>
      <nav aria-label="On this page">
        <p>On this page</p>
        <ul>
          <!-- headings extracted from the current doc -->
        </ul>
      </nav>
    </div>
  </aside>

</div>

</body>
</html>
