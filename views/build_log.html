{{define "build_log"}}
<div
	class="bl grid grid-cols-1 gap-s5 pt-[var(--spacing-section-pad)] pb-s6 border-b border-border md:grid-cols-[300px_1fr] md:gap-s7">
	<div class="flex flex-col items-start self-start">
		<h2 class="text-xl font-bold text-fg mb-s5">Build log</h2>
		<p class="text-lg leading-[1.65] text-fg-muted max-w-[34ch] mb-s5">Notes on what I'm building and why.</p>
		<a href="#"
			class="group inline-flex items-center gap-[6px] text-sm font-medium text-fg-muted no-underline transition-colors duration-[var(--dur)] ease-[var(--ease-out)] hover:text-fg">
			See the full log
			<svg
				class="w-[14px] h-[14px] stroke-2 transition-transform duration-[var(--dur)] ease-[var(--ease-out)] group-hover:translate-x-[2px]">
				<use href="#LuChevron"></use>
			</svg>
		</a>
	</div>
	{{if .}}
	<ol class="list-none border-t border-border">
		{{range .}}
		<li
			class="border-b border-border last:border-b-0 transition-colors duration-[var(--dur)] ease-[var(--ease-out)] hover:bg-surface-1">
			<a href="{{.Href}}" target="_blank" rel="noreferrer noopener"
				class="group flex items-center gap-s3 w-full px-s3 py-s4 text-md leading-[1.4] text-fg-muted no-underline transition-colors duration-[var(--dur)] ease-[var(--ease-out)] hover:text-fg focus-visible:outline-none focus-visible:[box-shadow:0_0_0_2px_var(--color-bg),0_0_0_4px_var(--color-focus)]">
				<span class="w-[54px] shrink-0 font-mono text-xs text-fg-subtle">{{.Date}}</span>
				<!-- a fixed width column, so every message starts at the same x whatever the pill's length -->
				<span class="w-[96px] shrink-0">
					<span
						class="inline-block max-w-full truncate align-middle rounded-pill border border-border bg-surface-2 px-s2 py-[2px] font-mono text-xs leading-[1.4] text-fg-muted">{{.Project}}</span>
				</span>
				<span class="min-w-0 truncate">{{.Message}}</span>
				<svg aria-hidden="true"
					class="ml-auto w-[14px] h-[14px] shrink-0 stroke-2 text-fg-subtle opacity-0 transition-[opacity,color] duration-[var(--dur)] ease-[var(--ease-out)] group-hover:opacity-100 group-hover:text-fg">
					<use href="#LuChevron"></use>
				</svg>
			</a>
		</li>
		{{end}}
	</ol>
